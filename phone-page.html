<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#14181c">
<title>DotSense camera</title>
<style>
:root {
  --bg: #14181c; --panel: #1c2126; --line: #2c333a; --text: #e6e9ec; --muted: #8b96a1;
  --accent: #f0a93a; --ink: #1c1200; --ok: #4cc27d; --bad: #ff7a6b;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f3f5f9; --panel: #ffffff; --line: #dde3ec; --text: #0f172a; --muted: #5d6a7e; --accent: #f59e0b; --ink: #1f1300; --ok: #15803d; --bad: #dc2626; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 16px/1.45 -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans Bengali', sans-serif; -webkit-text-size-adjust: 100%; }
main { max-width: 520px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); }
header { display: flex; align-items: center; gap: 10px; margin: 6px 0 14px; }
.logo { width: 17px; height: 25px; flex: none; }
.logo .on { fill: var(--accent); }
.logo .off { fill: none; stroke: var(--muted); stroke-width: 1.3; }
h1 { font-size: 1.25rem; margin: 0; letter-spacing: -0.01em; }
.conn { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 0.8rem; font-weight: 600; color: var(--muted); padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); white-space: nowrap; }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.conn[data-ok="yes"] { color: var(--ok); }
.conn[data-ok="yes"] i { background: var(--ok); }
.conn[data-ok="no"] { color: var(--bad); }
.conn[data-ok="no"] i { background: var(--bad); }
.lead { color: var(--muted); margin: 0 0 18px; font-size: 0.95rem; }
.big { position: relative; display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 62px; border-radius: 16px; font-size: 1.1rem; font-weight: 650; border: 1px solid var(--line); background: var(--panel); color: var(--text); margin: 0 0 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
.big.primary { background: var(--accent); color: var(--ink); border-color: transparent; min-height: 104px; font-size: 1.3rem; box-shadow: 0 10px 30px -14px rgba(240, 169, 58, 0.7); }
.big svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.big.primary svg { width: 34px; height: 34px; }
.big input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.big:active { transform: scale(0.985); }
.big:focus-within { outline: 3px solid var(--accent); outline-offset: 3px; }
#list { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 10px; }
#list li { display: flex; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
#list img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; background: var(--line); flex: none; }
.t { flex: 1; min-width: 0; }
.s { font-size: 0.92rem; font-weight: 600; }
.s[data-tone="ok"] { color: var(--ok); }
.s[data-tone="bad"] { color: var(--bad); font-weight: 500; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 6px; }
.bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width 150ms linear; }
.retry { margin-top: 6px; font: inherit; font-size: 0.85rem; font-weight: 600; padding: 6px 12px; border-radius: 9px; border: 1px solid var(--line); background: transparent; color: var(--text); }
.tips { color: var(--muted); font-size: 0.86rem; margin: 22px 0 0; border-top: 1px solid var(--line); padding-top: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <svg class="logo" viewBox="0 0 18 26" aria-hidden="true">
      <circle class="on" cx="4.5" cy="4.5" r="3.2"/><circle class="on" cx="13.5" cy="4.5" r="3.2"/>
      <circle class="off" cx="4.5" cy="13" r="3"/><circle class="on" cx="13.5" cy="13" r="3.2"/>
      <circle class="off" cx="4.5" cy="21.5" r="3"/><circle class="off" cx="13.5" cy="21.5" r="3"/>
    </svg>
    <h1>DotSense</h1>
    <span class="conn" id="conn" role="status"><i></i><span id="connText">Checking…</span></span>
  </header>
  <p class="lead">Photos you take here go straight to DotSense on your computer, and their text is read for braille.</p>
  <label class="big primary">
    <input id="cam" type="file" accept="image/*" capture="environment">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.3-2h5.2l1.3 2h1.6A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.4" r="3.6"/></svg>
    Take photo
  </label>
  <label class="big">
    <input id="pick" type="file" accept="image/*" multiple>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.7"/><path d="M20.5 16l-5-5-8.5 8.5"/></svg>
    Choose from gallery
  </label>
  <ul id="list" aria-live="polite"></ul>
  <p class="tips">For the best reading: hold the phone straight above the page, let the page fill the photo, and use good light without shadows.</p>
</main>
<script nonce="__NONCE__">
(() => {
  'use strict';
  const base = location.pathname.replace(/\/+$/, '');
  const $ = id => document.getElementById(id);
  const MAX_SIDE = 3200;   // enough for reading a full page; smaller photos go over the WiFi faster
  const queue = [];
  let sending = false;
  let misses = 0;

  const OLD_LINK = 'This link is old. Scan the QR code on the PC again.';
  function setConn(ok, text) {
    $('conn').dataset.ok = ok ? 'yes' : 'no';
    $('connText').textContent = text || (ok ? 'Connected to PC' : 'PC not reachable');
  }
  async function ping() {
    try {
      const r = await fetch(base + '/ping', { cache: 'no-store' });
      if (r.status === 404) { misses = 0; setConn(false, 'Old link'); return; }
      if (!r.ok) throw new Error(String(r.status));
      misses = 0;
      setConn(true);
    } catch (_) {
      if (++misses >= 2 || !$('conn').dataset.ok) setConn(false);
    }
  }
  ping();
  setInterval(() => { if (!document.hidden) ping(); }, 4000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) ping(); });

  // Upright (the camera's rotation applied), at most MAX_SIDE pixels, as JPEG.
  async function prepare(file) {
    let url = '';
    try {
      url = URL.createObjectURL(file);
      const img = new Image();
      img.src = url;
      await img.decode();
      const w = img.naturalWidth, h = img.naturalHeight;
      if (!w || !h) return file;
      const scale = Math.min(1, MAX_SIDE / Math.max(w, h));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.9));
      canvas.width = canvas.height = 0;
      return blob && blob.size > 1000 ? blob : file;
    } catch (_) {
      return file;   // send it as it is; the computer checks it
    } finally {
      if (url) URL.revokeObjectURL(url);
    }
  }

  function add(file) {
    const li = document.createElement('li');
    const img = document.createElement('img');
    img.alt = '';
    img.src = URL.createObjectURL(file);
    const t = document.createElement('div');
    t.className = 't';
    const s = document.createElement('div');
    s.className = 's';
    s.textContent = 'Waiting…';
    const bar = document.createElement('div');
    bar.className = 'bar';
    const fill = document.createElement('span');
    bar.append(fill);
    t.append(s, bar);
    li.append(img, t);
    $('list').prepend(li);
    queue.push({ file, li, t, s, bar, fill });
    pump();
  }

  async function pump() {
    if (sending) return;
    const item = queue.shift();
    if (!item) return;
    sending = true;
    try { await upload(item); } finally { sending = false; pump(); }
  }

  function show(item, tone, text) {
    item.s.textContent = text;
    item.s.dataset.tone = tone;
  }

  async function upload(item) {
    show(item, '', 'Preparing…');
    const blob = await prepare(item.file);
    await new Promise(resolve => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', base + '/photo');
      xhr.timeout = 180000;
      xhr.setRequestHeader('Content-Type', blob.type || 'application/octet-stream');
      xhr.upload.onprogress = e => {
        if (!e.lengthComputable) return;
        const pct = Math.round(100 * e.loaded / e.total);
        item.fill.style.width = pct + '%';
        show(item, '', 'Sending… ' + pct + '%');
      };
      xhr.onload = () => {
        let error = '';
        try { error = JSON.parse(xhr.responseText).error || ''; } catch (_) { /* not JSON */ }
        if (xhr.status === 200) { finish(item, true, 'On your PC ✓'); setConn(true); }
        else if (xhr.status === 404) { finish(item, false, OLD_LINK); setConn(false, 'Old link'); }
        else finish(item, false, error || 'The PC did not take the photo (' + xhr.status + ').');
        resolve();
      };
      xhr.onerror = xhr.ontimeout = () => {
        finish(item, false, 'Could not reach the PC. Is DotSense open, and is this phone on the same WiFi as the PC?');
        setConn(false);
        resolve();
      };
      xhr.send(blob);
    });
  }

  function finish(item, ok, text) {
    item.bar.hidden = true;
    show(item, ok ? 'ok' : 'bad', text);
    if (ok) return;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'retry';
    b.textContent = 'Try again';
    b.onclick = () => {
      b.remove();
      item.bar.hidden = false;
      item.fill.style.width = '0';
      show(item, '', 'Waiting…');
      queue.push(item);
      pump();
    };
    item.t.append(b);
  }

  for (const id of ['cam', 'pick']) {
    $(id).addEventListener('change', e => {
      for (const f of e.target.files) add(f);
      e.target.value = '';
    });
  }
})();
</script>
</body>
</html>
